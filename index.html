<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixelmon Adventure</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 120px;
            background: linear-gradient(to bottom, #fff, #eee);
            border: 4px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 18px;
            color: #333;
            text-shadow: 1px 1px 0 #fff;
            display: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            z-index: 100;
        }

        .battle-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: #f0f0f0;
            border-top: 4px solid #333;
            display: none;
            padding: 10px;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: auto;
        }

        .battle-text {
            width: 60%;
            height: 60px;
            background: #333;
            color: #fff;
            padding: 10px;
            font-size: 16px;
            float: left;
            border-radius: 4px;
            margin-right: 10px;
        }

        .battle-menu {
            width: 35%;
            height: 100%;
            float: right;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .btn {
            background: #fff;
            border: 2px solid #333;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.1s;
        }

            .btn:hover {
                background: #ddd;
                transform: scale(1.02);
            }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #555;
            margin-top: 5px;
            border: 1px solid #000;
            position: relative;
        }

        .hp-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.5s;
        }

        #player-hp-box {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 90;
        }

        #enemy-hp-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            text-align: right;
            z-index: 90;
        }

        .hidden {
            display: none !important;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 200;
            pointer-events: auto;
        }

            #start-screen h1 {
                font-size: 48px;
                margin-bottom: 20px;
                color: #facc15;
                text-shadow: 3px 3px 0 #000;
            }

        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #ef4444;
            color: #fff;
            border: 4px solid #fff;
            cursor: pointer;
            font-family: inherit;
        }

            #start-btn:hover {
                background: #dc2626;
            }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="start-screen">
            <h1>PIXELMON ADVENTURE</h1>
            <button id="start-btn" onclick="startGame()">START GAME</button>
            <p style="margin-top:20px; font-size: 14px; color: #aaa;">Arrow Keys/WASD to Move | SPACE to Interact</p>
        </div>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <div id="dialog-box" class="dialog-box"></div>

            <!-- Battle Interface -->
            <div id="battle-screen" class="hidden" style="position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to bottom, #87CEEB 50%, #90EE90 50%); z-index: 50; pointer-events: auto;">
                <div id="enemy-hp-box"><div id="enemy-name">Wild Ratata</div><div class="hp-bar"><div id="enemy-hp-fill" class="hp-fill"></div></div></div>
                <div id="player-hp-box"><div id="player-name">Pikachu</div><div class="hp-bar"><div id="player-hp-fill" class="hp-fill"></div></div></div>

                <canvas id="battle-canvas" width="800" height="420"></canvas>

                <div class="battle-ui" id="battle-menu-container">
                    <div class="battle-text" id="battle-log">What will Pikachu do?</div>
                    <div class="battle-menu">
                        <button class="btn" onclick="game.battlePlayerMove('tackle')">Tackle</button>
                        <button class="btn" onclick="game.battlePlayerMove('scratch')">Scratch</button>
                        <button class="btn" onclick="game.battlePlayerMove('heal')">Potion</button>
                        <button class="btn" onclick="game.battlePlayerMove('run')">Run</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ASSET GENERATOR - Procedural Pixel Art
         */
        const AssetGen = {
            createCanvas: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },

            getPlayer: (dir) => {
                const c = AssetGen.createCanvas(48, 48);
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                const skin = '#ffccaa', hair = '#654321', shirt = '#ff3333', pants = '#3333aa';

                // Body
                ctx.fillStyle = pants; ctx.fillRect(14, 38, 8, 8); ctx.fillRect(26, 38, 8, 8);
                ctx.fillStyle = shirt; ctx.fillRect(12, 28, 24, 12);
                ctx.fillStyle = skin; ctx.fillRect(14, 14, 20, 16);
                ctx.fillStyle = hair; ctx.fillRect(12, 8, 24, 10);

                // Direction details
                if (dir === 'down') {
                    ctx.fillStyle = skin; ctx.fillRect(8, 28, 6, 10); ctx.fillRect(34, 28, 6, 10); // Arms down
                    ctx.fillStyle = '#000'; ctx.fillRect(18, 18, 4, 4); ctx.fillRect(26, 18, 4, 4); // Eyes
                } else if (dir === 'up') {
                    ctx.fillStyle = hair; ctx.fillRect(14, 10, 20, 12); // Back of head
                } else if (dir === 'left') {
                    ctx.fillStyle = skin; ctx.fillRect(6, 28, 8, 8); // Left arm visible
                    ctx.fillStyle = '#000'; ctx.fillRect(16, 18, 4, 4); // Eye
                } else if (dir === 'right') {
                    ctx.fillStyle = skin; ctx.fillRect(34, 28, 8, 8); // Right arm visible
                    ctx.fillStyle = '#000'; ctx.fillRect(28, 18, 4, 4); // Eye
                }
                return c;
            },

            getNPC: (type) => {
                const c = AssetGen.createCanvas(48, 48);
                const ctx = c.getContext('2d');
                ctx.fillStyle = type === 'trainer' ? '#4488ff' : '#aa44aa';
                ctx.fillRect(14, 30, 20, 10);
                ctx.fillStyle = '#ffccaa'; ctx.fillRect(14, 14, 20, 16);
                ctx.fillStyle = type === 'trainer' ? '#ffffaa' : '#333';
                ctx.fillRect(12, 10, 24, 8);
                ctx.fillStyle = '#000'; ctx.fillRect(18, 18, 4, 4); ctx.fillRect(26, 18, 4, 4);
                return c;
            },

            getPokemon: (name, back = false) => {
                const c = AssetGen.createCanvas(96, 96);
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                let color = '#ccc', sec = '#fff';
                const colors = {
                    'Bulbasaur': ['#4ade80', '#1e3a8a'], 'Charmander': ['#f97316', '#fef3c7'],
                    'Squirtle': ['#3b82f6', '#fde68a'], 'Pikachu': ['#facc15', '#ef4444'],
                    'Jigglypuff': ['#fca5a5', '#fff'], 'Geodude': ['#78716c', '#d6d3d1'],
                    'Magikarp': ['#f97316', '#fcd34d'], 'Psyduck': ['#fde047', '#000'],
                    'Machop': ['#a8a29e', '#78350f'], 'Gastly': ['#5b21b6', '#a78bfa']
                };
                if (colors[name]) { color = colors[name][0]; sec = colors[name][1]; }

                const xOff = back ? 20 : 10;
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.ellipse(48, 60, 30, 25, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(48, 30, 25, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#000';
                if (back) { ctx.fillRect(35, 22, 6, 6); ctx.fillRect(55, 22, 6, 6); }
                else { ctx.fillRect(38, 25, 4, 4); ctx.fillRect(54, 25, 4, 4); }

                // Special features
                if (name === 'Pikachu') {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath(); ctx.moveTo(15, 25); ctx.lineTo(5, 10); ctx.lineTo(25, 20); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(81, 25); ctx.lineTo(91, 10); ctx.lineTo(71, 20); ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(25, 55, 8, 8); ctx.fillRect(63, 55, 8, 8);
                }
                if (name === 'Charmander') {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath(); ctx.moveTo(75, 45); ctx.lineTo(90, 35); ctx.lineTo(75, 55); ctx.fill();
                }
                return c;
            },

            getTile: (type) => {
                const c = AssetGen.createCanvas(48, 48);
                const ctx = c.getContext('2d');
                if (type === 'grass') { ctx.fillStyle = '#4ade80'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#22c55e'; for (let i = 0; i < 8; i++) ctx.fillRect(Math.random() * 40, Math.random() * 40, 3, 3); }
                if (type === 'water') { ctx.fillStyle = '#3b82f6'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#60a5fa'; for (let i = 0; i < 4; i++) ctx.fillRect(Math.random() * 30 + 5, Math.random() * 10 + 15, 12, 3); }
                if (type === 'path') { ctx.fillStyle = '#d6d3d1'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#a8a29e'; ctx.fillRect(6, 6, 36, 36); }
                if (type === 'floor') { ctx.fillStyle = '#e7e5e4'; ctx.fillRect(0, 0, 48, 48); ctx.strokeStyle = '#d6d3d1'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 48, 48); }
                if (type === 'wall') { ctx.fillStyle = '#78350f'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#92400e'; ctx.fillRect(6, 6, 36, 36); ctx.strokeStyle = '#451a03'; ctx.strokeRect(6, 6, 36, 36); }
                if (type === 'tree') { ctx.fillStyle = '#854d0e'; ctx.fillRect(20, 28, 8, 20); ctx.fillStyle = '#166534'; ctx.beginPath(); ctx.arc(24, 20, 22, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(18, 15, 12, 0, Math.PI * 2); ctx.fill(); }
                if (type === 'flower') { ctx.fillStyle = '#4ade80'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(24, 24, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(24, 24, 4, 0, Math.PI * 2); ctx.fill(); }
                if (type === 'counter') { ctx.fillStyle = '#b45309'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#fcd34d'; ctx.fillRect(4, 4, 40, 12); }
                if (type === 'pc') { ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#38bdf8'; ctx.fillRect(8, 8, 32, 24); }
                if (type === 'bookshelf') { ctx.fillStyle = '#78350f'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) ctx.fillRect(6 + i * 9, 6, 7, 36); }
                if (type === 'door') { ctx.fillStyle = '#451a03'; ctx.fillRect(0, 0, 48, 48); ctx.fillStyle = '#271004'; ctx.fillRect(8, 8, 32, 40); }
                return c;
            }
        };

        const Assets = { player: {}, npc: {}, pokemon: {}, tiles: {} };

        function initAssets() {
            ['down', 'up', 'left', 'right'].forEach(d => Assets.player[d] = AssetGen.getPlayer(d));
            Assets.npc.down = AssetGen.getNPC('npc');
            Assets.npc.trainer = AssetGen.getNPC('trainer');
            ['Bulbasaur', 'Charmander', 'Squirtle', 'Pikachu', 'Jigglypuff', 'Geodude', 'Magikarp', 'Psyduck', 'Machop', 'Gastly'].forEach(p => {
                Assets.pokemon[p] = AssetGen.getPokemon(p);
                Assets.pokemon[p + '_back'] = AssetGen.getPokemon(p, true);
            });
            ['grass', 'water', 'path', 'floor', 'wall', 'tree', 'flower', 'counter', 'pc', 'bookshelf', 'door'].forEach(t => Assets.tiles[t] = AssetGen.getTile(t));
        }

        /**
         * GAME ENGINE
         */
        const TILE_SIZE = 48;
        const MAP_W = 40;
        const MAP_H = 30;

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.ctx.imageSmoothingEnabled = false;

                this.uiLayer = document.getElementById('ui-layer');
                this.dialogBox = document.getElementById('dialog-box');
                this.battleScreen = document.getElementById('battle-screen');
                this.battleCanvas = document.getElementById('battle-canvas');
                this.battleCtx = this.battleCanvas.getContext('2d');

                this.state = 'START';
                this.keys = {};
                this.moveCooldown = false;

                this.camera = { x: 0, y: 0 };
                this.player = { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE, dir: 'down', sprite: null };

                this.maps = {};
                this.currentMap = 'town';
                this.entities = [];
                this.items = [];
                this.battle = null;

                this.setupInputs();
                this.initWorld();
                initAssets();
                this.player.sprite = Assets.player.down;
            }

            setupInputs() {
                window.addEventListener('keydown', e => {
                    if (this.state === 'ROAM') {
                        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key) && !this.moveCooldown) {
                            this.handleMovement(e.key);
                        }
                        if (e.key === ' ' || e.key === 'Enter') this.interact();
                    }
                    if (this.state === 'DIALOG' && (e.key === ' ' || e.key === 'Enter')) {
                        this.closeDialog();
                    }
                });
            }

            initWorld() {
                const townObjects = [];
                // Borders
                for (let x = 0; x < MAP_W; x++) { townObjects.push({ x, y: 0, type: 'tree' }); townObjects.push({ x, y: MAP_H - 1, type: 'tree' }); }
                for (let y = 0; y < MAP_H; y++) { townObjects.push({ x: 0, y, type: 'tree' }); townObjects.push({ x: MAP_W - 1, y, type: 'tree' }); }
                // Pond
                for (let x = 20; x < 30; x++) for (let y = 5; y < 12; y++) townObjects.push({ x, y, type: 'water' });
                // Paths
                for (let x = 5; x < 35; x++) townObjects.push({ x, y: 15, type: 'path' });
                for (let y = 15; y < 25; y++) townObjects.push({ x: 15, y, type: 'path' });

                // House 1 (Player) - Top Left area
                for (let x = 5; x < 10; x++) { townObjects.push({ x, y: 20, type: 'wall' }); townObjects.push({ x, y: 25, type: 'wall' }); }
                for (let y = 20; y <= 25; y++) { townObjects.push({ x: 4, y, type: 'wall' }); townObjects.push({ x: 10, y, type: 'wall' }); }
                townObjects.push({ x: 7, y: 25, type: 'door', target: 'house_player', tx: 4, ty: 8 });

                // House 2 (Mart) - Top Right
                for (let x = 28; x < 34; x++) { townObjects.push({ x, y: 5, type: 'wall' }); townObjects.push({ x, y: 10, type: 'wall' }); }
                for (let y = 5; y <= 10; y++) { townObjects.push({ x: 27, y, type: 'wall' }); townObjects.push({ x: 34, y, type: 'wall' }); }
                townObjects.push({ x: 30, y: 10, type: 'door', target: 'house_mart', tx: 4, ty: 8 });

                // House 3 (Center) - Bottom Right
                for (let x = 28; x < 34; x++) { townObjects.push({ x, y: 20, type: 'wall' }); townObjects.push({ x, y: 25, type: 'wall' }); }
                for (let y = 20; y <= 25; y++) { townObjects.push({ x: 27, y, type: 'wall' }); townObjects.push({ x: 34, y, type: 'wall' }); }
                townObjects.push({ x: 30, y: 25, type: 'door', target: 'house_center', tx: 4, ty: 8 });

                // Decor
                townObjects.push({ x: 12, y: 8, type: 'flower' }); townObjects.push({ x: 14, y: 10, type: 'flower' });
                townObjects.push({ x: 32, y: 16, type: 'tree' }); townObjects.push({ x: 33, y: 17, type: 'tree' });

                this.entities = [
                    { x: 18, y: 14, dir: 'down', type: 'trainer', name: 'Rival', team: ['Pikachu', 'Charmander'], interacted: false, dialog: "I'm the best!" },
                    { x: 22, y: 14, dir: 'down', type: 'trainer', name: 'Lass', team: ['Jigglypuff'], interacted: false, dialog: "Want to battle?" },
                    { x: 8, y: 12, dir: 'right', type: 'npc', name: 'Fisherman', dialog: "Fishing is life!" },
                    { x: 28, y: 12, dir: 'left', type: 'npc', name: 'Hiker', dialog: "Those mountains are huge." },
                    { x: 15, y: 22, dir: 'up', type: 'npc', name: 'Mom', dialog: "Don't forget your potion!" },
                    { x: 30, y: 22, dir: 'up', type: 'npc', name: 'Nurse', dialog: "We heal Pokemon here." }
                ];

                this.items = [
                    { x: 32, y: 16, type: 'potion', collected: false },
                    { x: 10, y: 22, type: 'pokeball', collected: false },
                    { x: 35, y: 8, type: 'berry', collected: false }
                ];

                this.maps['town'] = { w: MAP_W, h: MAP_H, objects: townObjects };
                this.maps['house_player'] = this.createInterior(10, 10, ['pc', 'bookshelf']);
                this.maps['house_mart'] = this.createInterior(10, 10, ['counter', 'counter', 'counter']);
                this.maps['house_center'] = this.createInterior(10, 10, ['pc', 'counter']);
            }

            createInterior(w, h, furniture) {
                const objs = [];
                for (let x = 0; x < w; x++) { objs.push({ x, y: 0, type: 'wall' }); objs.push({ x, y: h - 1, type: 'wall' }); }
                for (let y = 0; y < h; y++) { objs.push({ x: 0, y, type: 'wall' }); objs.push({ x: w - 1, y, type: 'wall' }); }
                // Exit door at bottom center
                const exitX = Math.floor(w / 2);
                objs.push({ x: exitX, y: h - 1, type: 'door', target: 'town', tx: 15, ty: 26 });

                furniture.forEach((f, i) => { objs.push({ x: 2 + (i * 3), y: 2, type: f }); });
                return { w, h, objects: objs };
            }

            handleMovement(key) {
                this.moveCooldown = true;
                setTimeout(() => this.moveCooldown = false, 150);

                let dx = 0, dy = 0, dir = '';
                if (key === 'ArrowUp' || key === 'w') { dy = -1; dir = 'up'; }
                if (key === 'ArrowDown' || key === 's') { dy = 1; dir = 'down'; }
                if (key === 'ArrowLeft' || key === 'a') { dx = -1; dir = 'left'; }
                if (key === 'ArrowRight' || key === 'd') { dx = 1; dir = 'right'; }

                if (dir) {
                    this.player.dir = dir;
                    this.player.sprite = Assets.player[dir];
                    this.tryMove(dx, dy);
                }
            }

            tryMove(dx, dy) {
                const nextX = this.player.x + dx * TILE_SIZE;
                const nextY = this.player.y + dy * TILE_SIZE;
                const map = this.maps[this.currentMap];

                // Boundary Check
                if (nextX < 0 || nextX >= map.w * TILE_SIZE || nextY < 0 || nextY >= map.h * TILE_SIZE) return;

                const playerRect = { x: nextX + 12, y: nextY + 12, w: 24, h: 24 };

                // Object Collision
                for (let obj of map.objects) {
                    if (['water', 'wall', 'tree', 'counter', 'pc', 'bookshelf'].includes(obj.type)) {
                        const objRect = { x: obj.x * TILE_SIZE, y: obj.y * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                        if (this.checkCollision(playerRect, objRect)) return;
                    }
                }

                // Entity Collision
                for (let ent of this.entities) {
                    if (ent.x * TILE_SIZE === nextX && ent.y * TILE_SIZE === nextY) return;
                }

                this.player.x = nextX;
                this.player.y = nextY;
                this.updateCamera();
            }

            checkCollision(r1, r2) {
                return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
            }

            updateCamera() {
                this.camera.x = this.player.x - this.canvas.width / 2;
                this.camera.y = this.player.y - this.canvas.height / 2;
                const map = this.maps[this.currentMap];
                this.camera.x = Math.max(0, Math.min(this.camera.x, map.w * TILE_SIZE - this.canvas.width));
                this.camera.y = Math.max(0, Math.min(this.camera.y, map.h * TILE_SIZE - this.canvas.height));
            }

            interact() {
                const px = Math.round(this.player.x / TILE_SIZE);
                const py = Math.round(this.player.y / TILE_SIZE);
                const map = this.maps[this.currentMap];

                let tx = px, ty = py;
                if (this.player.dir === 'up') ty--;
                if (this.player.dir === 'down') ty++;
                if (this.player.dir === 'left') tx--;
                if (this.player.dir === 'right') tx++;

                // Door
                const targetObj = map.objects.find(o => o.x === tx && o.y === ty && o.type === 'door');
                if (targetObj) {
                    this.switchMap(targetObj.target, targetObj.tx, targetObj.ty);
                    return;
                }

                // Item
                const itemIdx = this.items.findIndex(i => !i.collected && i.x === tx && i.y === ty);
                if (itemIdx !== -1) {
                    const item = this.items[itemIdx];
                    item.collected = true;
                    this.showDialog(`Found ${item.type.toUpperCase()}!`);
                    return;
                }

                // Entity
                const entity = this.entities.find(e => e.x === tx && e.y === ty);
                if (entity) {
                    if (entity.type === 'trainer' && !entity.interacted) {
                        entity.dir = this.player.dir === 'left' ? 'right' : this.player.dir === 'right' ? 'left' : this.player.dir;
                        this.startBattle(entity);
                    } else {
                        this.showDialog(entity.dialog || "Hello!");
                    }
                } else {
                    const adjEntity = this.entities.find(e => Math.abs(e.x - px) + Math.abs(e.y - py) === 1);
                    if (adjEntity) this.showDialog(adjEntity.dialog || "Hello!");
                }
            }

            switchMap(mapId, x, y) {
                this.currentMap = mapId;
                this.player.x = x * TILE_SIZE;
                this.player.y = y * TILE_SIZE;
                this.updateCamera();
            }

            showDialog(text) {
                this.state = 'DIALOG';
                this.dialogBox.innerText = text;
                this.dialogBox.style.display = 'block';
            }

            closeDialog() {
                this.state = 'ROAM';
                this.dialogBox.style.display = 'none';
            }

            startBattle(enemy) {
                this.state = 'BATTLE';
                this.battleScreen.classList.remove('hidden');
                this.dialogBox.style.display = 'none';

                this.battle = {
                    enemy: enemy,
                    playerMon: { name: 'Pikachu', hp: 100, maxHp: 100, lvl: 5 },
                    enemyMon: { name: enemy.team[0], hp: 80, maxHp: 80, lvl: 4 },
                    turn: 'player',
                    log: `Wild ${enemy.team[0]} appeared!`
                };

                this.updateBattleUI();
                this.drawBattleScene();
            }

            updateBattleUI() {
                const b = this.battle;
                document.getElementById('battle-log').innerText = b.log;
                document.getElementById('player-name').innerText = `${b.playerMon.name} Lv${b.playerMon.lvl}`;
                document.getElementById('enemy-name').innerText = `${b.enemyMon.name} Lv${b.enemyMon.lvl}`;

                const pPct = (b.playerMon.hp / b.playerMon.maxHp) * 100;
                const ePct = (b.enemyMon.hp / b.enemyMon.maxHp) * 100;

                document.getElementById('player-hp-fill').style.width = `${Math.max(0, pPct)}%`;
                document.getElementById('enemy-hp-fill').style.width = `${Math.max(0, ePct)}%`;

                document.getElementById('player-hp-box').style.display = 'block';
                document.getElementById('enemy-hp-box').style.display = 'block';

                const menu = document.getElementById('battle-menu-container');
                menu.style.display = b.turn === 'player' && b.playerMon.hp > 0 && b.enemyMon.hp > 0 ? 'block' : 'none';
            }

            drawBattleScene() {
                const ctx = this.battleCtx;
                ctx.clearRect(0, 0, 800, 420);
                ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, 800, 210);
                ctx.fillStyle = '#90EE90'; ctx.fillRect(0, 210, 800, 210);

                ctx.fillStyle = '#78350f';
                ctx.beginPath(); ctx.ellipse(600, 300, 150, 40, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(200, 350, 150, 40, 0, 0, Math.PI * 2); ctx.fill();

                if (this.battle.enemyMon.hp > 0) {
                    const spr = Assets.pokemon[this.battle.enemyMon.name];
                    if (spr) ctx.drawImage(spr, 540, 180);
                }
                if (this.battle.playerMon.hp > 0) {
                    const spr = Assets.pokemon[this.battle.playerMon.name + '_back'];
                    if (spr) ctx.drawImage(spr, 140, 230);
                }
            }

            battlePlayerMove(move) {
                const b = this.battle;
                if (b.turn !== 'player') return;

                let dmg = 0, msg = "";

                if (move === 'heal') {
                    b.playerMon.hp = Math.min(b.playerMon.maxHp, b.playerMon.hp + 30);
                    msg = `Pikachu used Potion! HP recovered.`;
                } else if (move === 'run') {
                    msg = `Got away safely!`;
                    setTimeout(() => this.endBattle(false), 1000);
                    b.log = msg; this.updateBattleUI(); this.drawBattleScene();
                    return;
                } else {
                    dmg = Math.floor(Math.random() * 15) + 10;
                    b.enemyMon.hp -= dmg;
                    msg = `Pikachu used ${move.toUpperCase()}! Dealt ${dmg} dmg.`;
                }

                b.log = msg;
                this.updateBattleUI();
                this.drawBattleScene();

                if (b.enemyMon.hp <= 0) {
                    b.log = `${b.enemyMon.name} fainted! You won!`;
                    this.updateBattleUI();
                    b.enemy.interacted = true;
                    setTimeout(() => this.endBattle(true), 2000);
                    return;
                }

                b.turn = 'enemy';
                this.updateBattleUI();
                setTimeout(() => this.battleEnemyTurn(), 1500);
            }

            battleEnemyTurn() {
                const b = this.battle;
                if (b.playerMon.hp <= 0) return;

                const moves = ['Tackle', 'Growl', 'Tail Whip'];
                const move = moves[Math.floor(Math.random() * moves.length)];
                const dmg = Math.floor(Math.random() * 12) + 8;

                b.playerMon.hp -= dmg;
                b.log = `Enemy ${b.enemyMon.name} used ${move}! Dealt ${dmg} dmg.`;
                this.updateBattleUI();
                this.drawBattleScene();

                if (b.playerMon.hp <= 0) {
                    b.log = `Pikachu fainted! You blacked out...`;
                    setTimeout(() => this.endBattle(false), 2000);
                } else {
                    b.turn = 'player';
                    this.updateBattleUI();
                }
            }

            endBattle(win) {
                this.state = 'ROAM';
                this.battleScreen.classList.add('hidden');
                this.battle = null;
                if (!win) {
                    this.player.x = 10 * TILE_SIZE;
                    this.player.y = 10 * TILE_SIZE;
                    this.currentMap = 'town';
                    this.updateCamera();
                }
            }

            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.state === 'ROAM' || this.state === 'DIALOG') {
                    const map = this.maps[this.currentMap];

                    for (let y = 0; y < map.h; y++) {
                        for (let x = 0; x < map.w; x++) {
                            const obj = map.objects.find(o => o.x === x && o.y === y);

                            // Culling
                            if (x * TILE_SIZE < this.camera.x - TILE_SIZE || x * TILE_SIZE > this.camera.x + this.canvas.width ||
                                y * TILE_SIZE < this.camera.y - TILE_SIZE || y * TILE_SIZE > this.camera.y + this.canvas.height) continue;

                            // Ground
                            let groundType = 'grass';
                            if (obj && (obj.type === 'water' || obj.type === 'path')) groundType = obj.type;
                            if (this.currentMap !== 'town') groundType = 'floor';

                            this.ctx.drawImage(Assets.tiles[groundType],
                                Math.floor(x * TILE_SIZE - this.camera.x),
                                Math.floor(y * TILE_SIZE - this.camera.y));

                            // Objects on top
                            if (obj && ['tree', 'flower', 'wall', 'door', 'counter', 'pc', 'bookshelf'].includes(obj.type)) {
                                this.ctx.drawImage(Assets.tiles[obj.type],
                                    Math.floor(x * TILE_SIZE - this.camera.x),
                                    Math.floor(y * TILE_SIZE - this.camera.y));
                            }
                        }
                    }

                    // Items
                    this.items.forEach(item => {
                        if (!item.collected) {
                            const ix = item.x * TILE_SIZE - this.camera.x;
                            const iy = item.y * TILE_SIZE - this.camera.y;
                            this.ctx.fillStyle = '#fff';
                            this.ctx.beginPath(); this.ctx.arc(ix + 24, iy + 24, 10, 0, Math.PI * 2); this.ctx.fill();
                            this.ctx.fillStyle = item.type === 'potion' ? '#f00' : '#0f0';
                            this.ctx.beginPath(); this.ctx.arc(ix + 24, iy + 24, 6, 0, Math.PI * 2); this.ctx.fill();
                        }
                    });

                    // Entities
                    this.entities.forEach(ent => {
                        const ex = ent.x * TILE_SIZE - this.camera.x;
                        const ey = ent.y * TILE_SIZE - this.camera.y;
                        const spr = ent.type === 'trainer' ? Assets.npc.trainer : Assets.npc.down;
                        this.ctx.drawImage(spr, Math.floor(ex), Math.floor(ey));
                        this.ctx.fillStyle = '#fff'; this.ctx.font = '10px Arial';
                        this.ctx.fillText(ent.name, ex, ey - 5);
                    });

                    // Player
                    this.ctx.drawImage(this.player.sprite,
                        Math.floor(this.player.x - this.camera.x),
                        Math.floor(this.player.y - this.camera.y));
                }

                requestAnimationFrame(() => this.loop());
            }
        }

        let game;
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            game = new Game();
            game.state = 'ROAM';
        }

    </script>

    <script src="game.js"></script>
</body>
