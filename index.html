<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Adventure - Kanto Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            border: 3px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px 20px;
            color: white;
            font-size: 14px;
            line-height: 1.6;
            max-width: 90%;
            min-width: 400px;
            display: none;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .dialogue-box.active {
            display: block;
        }
        
        .dialogue-name {
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 8px;
        }
        
        .dialogue-text {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .continue-indicator {
            position: absolute;
            bottom: 10px;
            right: 15px;
            animation: bounce 0.5s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        #battle-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%);
            border-top: 4px solid #ecf0f1;
            display: none;
            pointer-events: auto;
        }
        
        #battle-ui.active {
            display: flex;
        }
        
        .battle-info {
            flex: 1;
            padding: 15px;
            color: white;
        }
        
        .pokemon-info {
            margin-bottom: 10px;
        }
        
        .pokemon-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .health-bar-container {
            width: 200px;
            height: 20px;
            background: #1a252f;
            border: 2px solid #7f8c8d;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            transition: width 0.3s ease, background 0.3s ease;
        }
        
        .health-bar.low {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }
        
        .health-bar.medium {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }
        
        .health-text {
            font-size: 12px;
            margin-top: 3px;
        }
        
        .battle-menu {
            width: 250px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .battle-btn {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            border: 3px solid #ecf0f1;
            border-radius: 8px;
            color: white;
            padding: 12px 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        .battle-btn:hover {
            background: linear-gradient(180deg, #5dade2 0%, #3498db 100%);
            transform: scale(1.05);
        }
        
        .battle-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .move-selection {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            border-top: 3px solid #ecf0f1;
            display: none;
            pointer-events: auto;
        }
        
        .move-selection.active {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }
        
        .move-btn {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.2s;
        }
        
        .move-btn:hover {
            background: linear-gradient(180deg, #ec7063 0%, #e74c3c 100%);
        }
        
        .move-pp {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 3px;
        }
        
        #location-name {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
        }
        
        #location-name.active {
            display: block;
            animation: fadeInOut 2s forwards;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        
        #inventory-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 100%);
            border: 3px solid #ecf0f1;
            border-radius: 8px;
            color: white;
            padding: 8px 15px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
        }
        
        #inventory-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            border: 4px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            color: white;
            display: none;
            pointer-events: auto;
            min-width: 400px;
            z-index: 200;
        }
        
        #inventory-panel.active {
            display: block;
        }
        
        .inventory-title {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #f39c12;
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .inventory-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .inventory-item:hover {
            background: rgba(255,255,255,0.2);
            border-color: #f39c12;
        }
        
        .inventory-item img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        
        .inventory-item-count {
            font-size: 10px;
            margin-top: 5px;
        }
        
        .close-btn {
            background: #e74c3c;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            color: white;
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }
        
        #party-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            border: 4px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            color: white;
            display: none;
            pointer-events: auto;
            min-width: 500px;
            z-index: 200;
        }
        
        #party-panel.active {
            display: block;
        }
        
        .party-title {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #f39c12;
        }
        
        .party-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .party-member {
            background: rgba(255,255,255,0.1);
            border: 2px solid #7f8c8d;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .party-member:hover {
            background: rgba(255,255,255,0.2);
            border-color: #3498db;
        }
        
        .party-member.fainted {
            opacity: 0.5;
        }
        
        .party-sprite {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            display: block;
            margin: 0 auto;
        }
        
        .party-info {
            text-align: center;
            margin-top: 8px;
        }
        
        .party-name {
            font-size: 12px;
            font-weight: bold;
        }
        
        .party-hp {
            font-size: 10px;
            margin-top: 3px;
        }
        
        .party-hp-bar {
            width: 100%;
            height: 8px;
            background: #1a252f;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 3px;
        }
        
        .party-hp-fill {
            height: 100%;
            background: #2ecc71;
            transition: width 0.3s;
        }
        
        #shop-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            border: 4px solid #ecf0f1;
            border-radius: 12px;
            padding: 20px;
            color: white;
            display: none;
            pointer-events: auto;
            min-width: 400px;
            z-index: 200;
        }
        
        #shop-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div id="location-name"></div>
            <button id="inventory-btn">📦 Bag</button>
            <div class="dialogue-box" id="dialogue-box">
                <div class="dialogue-name" id="dialogue-name"></div>
                <div class="dialogue-text" id="dialogue-text"></div>
                <div class="continue-indicator">▼</div>
            </div>
            <div id="battle-ui">
                <div class="battle-info">
                    <div class="pokemon-info">
                        <div class="pokemon-name" id="enemy-name">Wild Pokemon</div>
                        <div class="health-bar-container">
                            <div class="health-bar" id="enemy-health" style="width: 100%"></div>
                        </div>
                        <div class="health-text" id="enemy-hp-text">100/100</div>
                    </div>
                </div>
                <div class="battle-info" style="text-align: right;">
                    <div class="pokemon-info">
                        <div class="pokemon-name" id="player-pokemon-name">Pokemon</div>
                        <div class="health-bar-container" style="margin-left: auto;">
                            <div class="health-bar" id="player-health" style="width: 100%"></div>
                        </div>
                        <div class="health-text" id="player-hp-text">100/100</div>
                    </div>
                </div>
                <div class="battle-menu" id="battle-menu">
                    <button class="battle-btn" data-action="fight">Fight</button>
                    <button class="battle-btn" data-action="bag">Bag</button>
                    <button class="battle-btn" data-action="pokemon">Pokemon</button>
                    <button class="battle-btn" data-action="run">Run</button>
                </div>
                <div class="move-selection" id="move-selection"></div>
            </div>
            <div id="inventory-panel">
                <div class="inventory-title">🎒 Backpack</div>
                <div class="inventory-grid" id="inventory-grid"></div>
                <button class="close-btn" onclick="toggleInventory()">Close</button>
            </div>
            <div id="party-panel">
                <div class="party-title">🔴 Your Party</div>
                <div class="party-grid" id="party-grid"></div>
                <button class="close-btn" onclick="toggleParty()">Close</button>
            </div>
            <div id="shop-panel">
                <div class="inventory-title">🏪 Pokémart</div>
                <div style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #f39c12;">Money: <span id="shop-money">$0</span></div>
                <div class="inventory-grid" id="shop-grid"></div>
                <button class="close-btn" onclick="closeShop()">Leave Shop</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
