<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
        }
        
        #game-container {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #game-canvas {
            display: block;
            image-rendering: pixelated;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .dialog-box {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, #f8f8f8, #d0d0d0);
            border: 4px solid #404040;
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 90%;
            max-width: 95%;
            display: none;
            pointer-events: auto;
        }
        
        .dialog-text {
            color: #202020;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .dialog-name {
            font-weight: bold;
            color: #c03030;
            margin-bottom: 5px;
        }
        
        .battle-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
            border-top: 4px solid #404040;
            display: none;
            pointer-events: auto;
        }
        
        .battle-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border: 3px solid #404040;
            border-radius: 8px;
            padding: 10px;
            min-width: 200px;
        }
        
        .enemy-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: 3px solid #404040;
            border-radius: 8px;
            padding: 10px;
            min-width: 200px;
        }
        
        .hp-bar {
            width: 150px;
            height: 12px;
            background: #e0e0e0;
            border: 2px solid #404040;
            border-radius: 6px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .hp-fill {
            height: 100%;
            background: linear-gradient(to right, #4caf50, #8bc34a);
            transition: width 0.3s ease;
        }
        
        .hp-fill.low {
            background: linear-gradient(to right, #f44336, #ff5722);
        }
        
        .hp-fill.medium {
            background: linear-gradient(to right, #ffeb3b, #ffc107);
        }
        
        .battle-menu {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .battle-btn {
            background: white;
            border: 3px solid #404040;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .battle-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .pokemon-select {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 4px solid #404040;
            border-radius: 8px;
            padding: 20px;
            display: none;
            pointer-events: auto;
        }
        
        .pokemon-option {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #f0f0f0;
            border: 2px solid #808080;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .pokemon-option:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }
        
        .pokemon-option img {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            margin-right: 10px;
        }
        
        .message-log {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        
        .item-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
            animation: fadeInOut 2s ease;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }
        
        .controls-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div class="controls-hint">
                WASD/Arrows: Move | Enter: Interact | Esc: Menu
            </div>
            <div class="dialog-box" id="dialog-box">
                <div class="dialog-name" id="dialog-name"></div>
                <div class="dialog-text" id="dialog-text"></div>
            </div>
            <div class="battle-ui" id="battle-ui">
                <div class="player-info battle-info">
                    <div id="player-pokemon-name"></div>
                    <div>Level: <span id="player-pokemon-level"></span></div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="player-hp-fill"></div>
                    </div>
                    <div><span id="player-hp-current"></span>/<span id="player-hp-max"></span> HP</div>
                </div>
                <div class="enemy-info">
                    <div id="enemy-pokemon-name"></div>
                    <div>Level: <span id="enemy-pokemon-level"></span></div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="enemy-hp-fill"></div>
                    </div>
                    <div><span id="enemy-hp-current"></span>/<span id="enemy-hp-max"></span> HP</div>
                </div>
                <div class="battle-menu" id="battle-menu">
                    <button class="battle-btn" onclick="game.battle.attack()">Fight</button>
                    <button class="battle-btn" onclick="game.battle.usePotion()">Potion</button>
                    <button class="battle-btn" onclick="game.battle.throwPokeball()">Pokéball</button>
                    <button class="battle-btn" onclick="game.battle.run()">Run</button>
                </div>
            </div>
            <div class="pokemon-select" id="pokemon-select"></div>
            <div class="message-log" id="message-log"></div>
            <div class="item-notification" id="item-notification"></div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
