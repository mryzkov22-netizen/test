<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Adventure - Pixel Art Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 100%);
            border: 3px solid #6a6a8a;
            border-radius: 8px;
            padding: 15px 20px;
            color: #fff;
            font-size: 14px;
            min-width: 400px;
            max-width: 600px;
            display: none;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .dialog-text {
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .dialog-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dialog-option {
            background: #4a4a6a;
            border: 2px solid #6a6a8a;
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .dialog-option:hover {
            background: #6a6a8a;
            transform: translateY(-2px);
        }

        .battle-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a3a 100%);
            border-top: 3px solid #6a6a8a;
            padding: 15px;
            display: none;
            pointer-events: auto;
        }

        .battle-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .pokemon-info {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            min-width: 200px;
        }

        .pokemon-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.3s;
        }

        .hp-fill.low {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }

        .hp-fill.medium {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .battle-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .battle-action {
            background: #4a4a6a;
            border: 2px solid #6a6a8a;
            color: #fff;
            padding: 12px;
            cursor: pointer;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.2s;
        }

        .battle-action:hover {
            background: #6a6a8a;
            transform: translateY(-2px);
        }

        .battle-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .move-info {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a3a 0%, #0a0a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            pointer-events: auto;
        }

        .game-title {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 3px 3px 0 #4a4a6a, 6px 6px 0 #2a2a4a;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .start-button {
            background: linear-gradient(135deg, #4a4a6a 0%, #2a2a4a 100%);
            border: 3px solid #6a6a8a;
            color: #fff;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .start-button:hover {
            background: linear-gradient(135deg, #6a6a8a 0%, #4a4a6a 100%);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .controls-info {
            margin-top: 30px;
            text-align: center;
            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }

        .pixel-art-decoration {
            width: 100px;
            height: 100px;
            margin: 20px;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-overlay">
            <div id="start-screen">
                <h1 class="game-title">🎮 Pokémon Adventure</h1>
                <button class="start-button" onclick="startGame()">START GAME</button>
                <div class="controls-info">
                    Arrow Keys / WASD - Move<br>
                    SPACE / ENTER - Interact<br>
                    ESC - Close Dialog
                </div>
            </div>

            <div id="dialog-box" class="dialog-box">
                <div id="dialog-text" class="dialog-text"></div>
                <div id="dialog-options" class="dialog-options"></div>
            </div>

            <div id="battle-ui" class="battle-ui">
                <div class="battle-info">
                    <div class="pokemon-info">
                        <div class="pokemon-name" id="player-pokemon-name">Pikachu</div>
                        <div>HP: <span id="player-hp">100/100</span></div>
                        <div class="hp-bar">
                            <div id="player-hp-bar" class="hp-fill" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="pokemon-info">
                        <div class="pokemon-name" id="enemy-pokemon-name">Rattata</div>
                        <div>HP: <span id="enemy-hp">100/100</span></div>
                        <div class="hp-bar">
                            <div id="enemy-hp-bar" class="hp-fill" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
                <div class="battle-actions" id="battle-actions">
                    <!-- Battle moves will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
