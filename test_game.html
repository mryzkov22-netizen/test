<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixelmon Adventure - Test</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 720px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 120px;
            background: linear-gradient(to bottom, #fff, #eee);
            border: 4px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.5;
            display: none;
            pointer-events: auto;
            z-index: 100;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 200;
            pointer-events: auto;
        }

        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0 #000;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            background: #ffcb05;
            border: 4px solid #3c5aa6;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #start-btn:hover {
            transform: scale(1.05);
        }

        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="720"></canvas>
        
        <div id="ui-layer">
            <div id="dialog-box" class="dialog-box"></div>
        </div>

        <div id="start-screen">
            <h1>PIXELMON ADVENTURE</h1>
            <button id="start-btn" onclick="startGame()">START GAME</button>
            <p style="margin-top:20px; font-size: 14px; color: #aaa;">Arrow Keys/WASD to Move | SPACE to Interact</p>
        </div>
    </div>

    <script src="game.js"></script>
    
    <script>
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            initGame();
        }
    </script>
</body>
</html>
